# 部署 Nginx
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
spec:
  replicas: 1  # 运行1个Pod副本
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
# 服务暴露，让集群内外可访问
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  selector:
    app: nginx
  ports:
  - port: 80      # Service 内部端口
    targetPort: 80 # 转发到容器端口
  type: NodePort  # 本地集群首选类型，会随机分配主机端口