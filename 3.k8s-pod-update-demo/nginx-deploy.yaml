apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        # 自定义标签，相当于“别名/标记”
        pod-alias: local-nginx-web
    spec:
      containers:
      - name: nginx
        image: my-nginx:v2
        # 关键配置：只使用本地镜像，不从仓库拉取
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
  type: NodePort