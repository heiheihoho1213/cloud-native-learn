apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-service
      version: v2
  template:
    metadata:
      labels:
        app: go-service
        version: v2
    spec:
      containers:
      - name: go-service
        image: service-demo:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: VERSION
          value: "V2"