apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-service
      version: v1
  template:
    metadata:
      labels:
        app: go-service
        version: v1
    spec:
      containers:
      - name: go-service
        image: service-demo:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: VERSION
          value: "V1"